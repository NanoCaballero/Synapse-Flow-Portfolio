    <text x="360" y="372" font-size="12" fill="#8A789F">ARCHITECTURE PLACEHOLDER · reemplazar con diagrama oficial</text>
    <text x="360" y="394" font-size="11" fill="#8A789F">[LINK DIAGRAMA DE ARQUITECTURA]</text>
