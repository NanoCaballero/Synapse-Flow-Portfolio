<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Diagrama placeholder del pipeline Definir, Compilar, Ejecutar">
  <defs>
    <linearGradient id="ex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9517F2"/>
      <stop offset="1" stop-color="#E85FC4"/>
    </linearGradient>
  </defs>
  <rect width="720" height="320" rx="20" fill="#0F0819" stroke="#2E1F45" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" text-anchor="middle">
    <text x="360" y="46" font-family="'Bricolage Grotesque', sans-serif" font-size="18" font-weight="bold" fill="#F3EEFB">Definir &#8594; Compilar &#8594; Ejecutar</text>
    <g font-size="15">
      <rect x="60"  y="110" width="170" height="90" rx="14" fill="#160D27" stroke="#9517F2" stroke-width="1.5"/>
      <text x="145" y="150" fill="#F3EEFB" font-weight="bold">Definir</text>
      <text x="145" y="174" fill="#8A789F" font-size="12">Grafo de nodos</text>

      <rect x="275" y="110" width="170" height="90" rx="14" fill="#9517F2"/>
      <text x="360" y="150" fill="#FFFFFF" font-weight="bold">Compilar</text>
      <text x="360" y="174" fill="#E8DEFA" font-size="12">Validar y ordenar</text>

      <rect x="490" y="110" width="170" height="90" rx="14" fill="url(#ex)"/>
      <text x="575" y="150" fill="#FFFFFF" font-weight="bold">Ejecutar</text>
      <text x="575" y="174" fill="#FFE8F8" font-size="12">Runtime de agentes</text>
    </g>
    <g stroke="#B98CFF" stroke-width="3" fill="#B98CFF">
      <line x1="230" y1="155" x2="270" y2="155"/>
      <polygon points="270,150 280,155 270,160"/>
      <line x1="445" y1="155" x2="485" y2="155"/>
      <polygon points="485,150 495,155 485,160"/>
    </g>
    <text x="360" y="280" font-size="12" fill="#8A789F">WORKFLOW PLACEHOLDER · reemplazar con captura del canvas</text>
  </g>
