      <rect x="500" y="152" width="180" height="48" rx="10" fill="#160D27" stroke="#3A2A55"/>
      <text x="590" y="181" fill="#CDB2FF">Capacidades externas</text>

      <rect x="40"  y="252" width="180" height="48" rx="10" fill="#120A20" stroke="#2E1F45"/>
      <text x="130" y="281" fill="#BFAEDC">PostgreSQL · pgvector</text>
      <rect x="270" y="252" width="180" height="48" rx="10" fill="#120A20" stroke="#2E1F45"/>
      <text x="360" y="281" fill="#BFAEDC">Google ADK · Gemini</text>
