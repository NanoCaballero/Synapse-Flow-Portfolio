<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Diagrama placeholder de arquitectura de microservicios de Synapse-Flow">
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9517F2"/>
      <stop offset="1" stop-color="#6B1FB0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="20" fill="#0F0819" stroke="#2E1F45" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace" text-anchor="middle">
