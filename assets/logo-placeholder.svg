<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Logo placeholder de Synapse-Flow">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9517F2"/>
      <stop offset="1" stop-color="#6B2FA0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#lg)"/>
  <!-- Nodos conectados que representan un grafo de workflow -->
  <g fill="none" stroke="#F3E8FF" stroke-width="6" stroke-linecap="round">
    <line x1="62" y1="70" x2="100" y2="118"/>
    <line x1="138" y1="70" x2="100" y2="118"/>
    <line x1="100" y1="118" x2="100" y2="150"/>
  </g>
  <g fill="#FBF8FF" stroke="#2D123F" stroke-width="3">
    <circle cx="62" cy="70" r="16"/>
    <circle cx="138" cy="70" r="16"/>
    <circle cx="100" cy="118" r="18"/>
    <circle cx="100" cy="156" r="12"/>
  </g>
  <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#F3E8FF">LOGO</text>
</svg>
